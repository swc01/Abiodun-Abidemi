name: GNT Auto Marketing Promoter

on:
  schedule:
    # This runs the script automatically every day at 6:00 PM WAT (17:00 UTC)
    - cron: '0 17 * * *'
  workflow_dispatch: # Allows you to trigger it manually anytime with a single button click

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Vault Code
      uses: actions/checkout@v4

    - name: Deploy Python Environment
      uses: actions/setup-python@v5
      with:
        python-python-version: '3.10'

    - name: Install System Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Execute Auto Promoter Script
      run: python gnt_promoter.py
