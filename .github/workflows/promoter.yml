name: GNT Auto Marketing Promoter

on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Vault Code
      uses: actions/checkout@v4

    - name: Deploy Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Execute Auto Promoter Script
      run: python gnt_promoter.py
